services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: trip_ai
      POSTGRES_PASSWORD: trip_ai
      POSTGRES_DB: trip_ai
    ports:
      - "5432:5432"
    volumes:
      - tripmate_pgdata:/var/lib/postgresql/data

  tripmate:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_started
    env_file:
      - .env.docker
    ports:
      - "8000:8000"

volumes:
  tripmate_pgdata:
